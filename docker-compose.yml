services:
  app:
    build: .
    image: tiny-buddy:local
    container_name: tiny-buddy
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      DATABASE_FILE: "/app/data/tiny-buddy.db"
      PUBLIC_URL: "${PUBLIC_URL:-http://localhost:8787}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.deepseek.com/v1}"
      OPENAI_MODEL: "${OPENAI_MODEL:-deepseek-chat}"
    volumes:
      - ./data:/app/data
