name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all packages)
        run: pnpm typecheck

      - name: Build web bundle
        run: pnpm build

      - name: Smoke test server
        run: |
          pnpm seed
          node -e "
            const { spawn } = require('node:child_process');
            const child = spawn('pnpm', ['--filter', '@tiny-buddy/server', 'start'], { stdio: 'inherit' });
            const started = Date.now();
            const tick = async () => {
              try {
                const res = await fetch('http://127.0.0.1:8787/api/health');
                const body = await res.json();
                if (!body.ok) throw new Error('health not ok');
                console.log('health ok after', Date.now() - started, 'ms');
                child.kill('SIGTERM');
                process.exit(0);
              } catch {
                if (Date.now() - started > 60000) { child.kill('SIGTERM'); process.exit(1); }
                setTimeout(tick, 1000);
              }
            };
            tick();
          "
